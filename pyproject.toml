[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "2.0.0"
description = "Advanced Network Scanner — port detection, service fingerprinting, banner grabbing"
readme = "README.md"
authors = [
    { name = "Prateek Raghuvanshi", email = "prateek7876@example.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["network-scanner", "port-scanning", "security", "nmap", "cybersecurity"]
requires-python = ">=3.9"
dependencies = [
    "python-nmap>=0.7.1",
    "colorama>=0.4.6",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/prateek7876/network-scanner"
Repository = "https://github.com/prateek7876/network-scanner"
Documentation = "https://github.com/prateek7876/network-scanner#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# ASCII-art startup banner is intentionally wider than the line limit
"src/netscan/cli.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=src/netscan --cov-report=term-missing --cov-report=html:coverage_html"

[tool.coverage.run]
source = ["src/netscan"]
omit = ["*/tests/*", "*/__main__.py"]
